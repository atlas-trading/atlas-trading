name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  core-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-platform

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --extra dev

      - run: uv run pytest tests/ -v
