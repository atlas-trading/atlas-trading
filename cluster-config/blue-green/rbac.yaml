apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server
  namespace: atlas-trading
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
  namespace: atlas-trading
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-server-secret-manager
  namespace: atlas-trading
subjects:
- kind: ServiceAccount
  name: api-server
  namespace: atlas-trading
roleRef:
  kind: Role
  name: secret-manager
  apiGroup: rbac.authorization.k8s.io
