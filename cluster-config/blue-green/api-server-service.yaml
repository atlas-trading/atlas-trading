apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: atlas-trading
  labels:
    app: api-server
spec:
  type: ClusterIP
  selector:
    app: api-server
    version: blue  # Initially route to blue. Switch to 'green' for deployment.
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
