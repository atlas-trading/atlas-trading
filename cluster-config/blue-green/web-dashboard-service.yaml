apiVersion: v1
kind: Service
metadata:
  name: web-dashboard
  namespace: atlas-trading
  labels:
    app: web-dashboard
spec:
  type: LoadBalancer
  selector:
    app: web-dashboard
    version: blue  # Initially route to blue. Switch to 'green' for deployment.
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
