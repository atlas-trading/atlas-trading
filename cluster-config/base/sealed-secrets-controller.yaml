---
# Sealed Secrets Controller
# Allows encrypting Kubernetes Secrets so they can be safely stored in git.
#
# Install: kubectl apply -f sealed-secrets-controller.yaml
# Docs: https://github.com/bitnami-labs/sealed-secrets
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
# Download the latest release manifest from:
# https://github.com/bitnami-labs/sealed-secrets/releases
# Example (pin to a specific version for reproducibility):
#
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.0/controller.yaml
#
# Or install via Helm:
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
