# =============================================================================
# SealedSecret 템플릿
# -----------------------------------------------------------------------------
# 이 파일은 직접 사용하지 말고, setup-sealed-secrets.sh 스크립트를 참고해
# kubeseal 명령으로 실제 값을 암호화한 후 이 구조로 저장하세요.
#
# 생성 방법:
#   kubeseal --format yaml < /tmp/atlas-secrets-plain.yaml > sealed-secret.yaml
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: atlas-secrets
  namespace: atlas-trading
spec:
  encryptedData:
    # 아래 값들은 kubeseal로 암호화된 실제 값으로 교체됩니다.
    # 예시 (실제 암호화된 값은 훨씬 긴 base64 문자열):
    DB_USER: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    DB_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    BINANCE_API_KEY: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    BINANCE_SECRET_KEY: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    SECRET_KEY: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
  template:
    metadata:
      name: atlas-secrets
      namespace: atlas-trading
    type: Opaque
