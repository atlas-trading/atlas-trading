apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-trading
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/atlas-trading/atlas-trading
    targetRevision: main
    path: cluster-config

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
