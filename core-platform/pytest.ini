[pytest]
# Pytest 설정

# 테스트 디렉토리
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py *_test.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*

# 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# 마커
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (skipped by default)

# 경로 설정
pythonpath = .
