apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: atlas-trading
data:
  # API Server Config
  API_TITLE: "Atlas Trading API"
  API_VERSION: "1.0.0"
  API_PREFIX: "/api/v1"
  CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'

  # Database Config
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "atlas_trading"

  # Redis Config
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Environment
  ENVIRONMENT: "production"
